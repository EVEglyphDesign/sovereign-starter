<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="s2-title s2-desc">
  <title id="s2-title">GitHub authorize screen with a pirate X on Authorize</title>
  <desc id="s2-desc">Reconstruction of the GitHub OAuth authorize screen. Shows an application requesting repo scope. A pirate-red X marks the Authorize button.</desc>

  <rect width="720" height="520" fill="#ffffff"/>

  <!-- top strip -->
  <rect x="0" y="0" width="720" height="52" fill="#0d1117"/>
  <g transform="translate(24,14)">
    <path fill="#ffffff" d="M12 0C5.4 0 0 5.4 0 12c0 5.3 3.4 9.8 8.2 11.4.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17 4.4 18 4.7 18 4.7c.6 1.7.2 2.9.1 3.2.7.8 1.2 1.9 1.2 3.2 0 4.7-2.8 5.6-5.5 5.9.5.4.8 1.1.8 2.3v3.4c0 .3.2.7.8.6A11.9 11.9 0 0 0 24 12c0-6.6-5.4-12-12-12z"/>
  </g>
  <text x="60" y="34" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">GitHub</text>

  <!-- card -->
  <g transform="translate(180,84)">
    <rect x="0" y="0" width="360" height="380" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="8"/>

    <text x="180" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Authorize your AI surface</text>
    <text x="180" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6b665c">to act on your GitHub account</text>

    <line x1="24" y1="92" x2="336" y2="92" stroke="#e7e1d3" stroke-width="1"/>

    <text x="24" y="124" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Requested permissions</text>

    <g transform="translate(24,142)">
      <circle cx="8" cy="8" r="4" fill="#1f883d"/>
      <text x="24" y="12" font-family="Inter, sans-serif" font-size="13" fill="#1a1a1a">Read and write access to your repositories</text>
    </g>
    <g transform="translate(24,168)">
      <circle cx="8" cy="8" r="4" fill="#1f883d"/>
      <text x="24" y="12" font-family="Inter, sans-serif" font-size="13" fill="#1a1a1a">Create new repositories on your behalf</text>
    </g>
    <g transform="translate(24,194)">
      <circle cx="8" cy="8" r="4" fill="#1f883d"/>
      <text x="24" y="12" font-family="Inter, sans-serif" font-size="13" fill="#1a1a1a">Read your public profile</text>
    </g>

    <!-- Authorize button -->
    <rect x="24" y="256" width="312" height="44" fill="#1f883d" rx="6"/>
    <text x="180" y="283" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Authorize</text>

    <!-- Cancel button -->
    <rect x="24" y="312" width="312" height="40" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
    <text x="180" y="337" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1a1a1a">Cancel</text>
  </g>

  <!-- pirate red X over Authorize -->
  <g transform="translate(360,362)">
    <line x1="-32" y1="-24" x2="32" y2="24" stroke="#c8102e" stroke-width="7" stroke-linecap="round"/>
    <line x1="32" y1="-24" x2="-32" y2="24" stroke="#c8102e" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="360" y="490" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="14" font-style="italic" fill="#6b665c">Step 2 &middot; authorize the surface &middot; X marks the spot</text>
  <text x="360" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6b665c">reconstruction of the GitHub OAuth authorize screen &middot; not a live capture</text>
</svg>
